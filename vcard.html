<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Florian Marin — CRM RevOps Sprint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #1C1C1C;
      --card: #242424;
      --line: #333333;
      --ink: #FFFFFF;
      --muted: #B8B8B8;
      --gold: #FF7A00;
      --gold-hi: #FFD84D;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(900px 500px at 50% -8%, #2a2a2a 0%, var(--bg) 60%);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 34px 30px 30px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
    }

    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--gold), var(--gold-hi));
    }

    /* logo mark FM */
    .logo {
      position: absolute;
      top: 22px;
      right: 24px;
      width: 46px;
      height: 46px;
      border-radius: 11px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: -1px;
      border: 1px solid #000
    }

    .grad {
      background: linear-gradient(90deg, var(--gold), var(--gold-hi));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent
    }

    .logo .f {
      color: #fff
    }

    .logo .m {
      background: linear-gradient(90deg, var(--gold), var(--gold-hi));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent
    }

    .top {
      display: flex;
      align-items: center;
      gap: 18px
    }

    .photo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      flex: none;
      object-fit: cover;
      border: 2px solid var(--gold);
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 26px;
      letter-spacing: -1px;
    }

    .photo .f {
      color: #fff
    }

    .photo .m {
      background: linear-gradient(90deg, var(--gold), var(--gold-hi));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent
    }

    h1 {
      font-size: 23px;
      font-weight: 700;
      letter-spacing: -.4px
    }

    .role {
      color: var(--gold);
      font-size: 12.5px;
      margin-top: 5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .6px
    }

    .tagline {
      margin: 24px 0 26px;
      font-size: 16px;
      line-height: 1.55;
      font-weight: 500;
      color: var(--ink);
    }

    .tagline b {
      background: linear-gradient(90deg, var(--gold), var(--gold-hi));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 0 0 24px
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 24px
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      padding: 13px 10px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 600;
      transition: .15s;
      border: 1px solid var(--line);
      font-family: inherit;
    }

    .btn svg {
      width: 16px;
      height: 16px
    }

    .btn.primary {
      background: linear-gradient(90deg, var(--gold), var(--gold-hi));
      color: #1C1C1C;
      border: none;
      grid-column: 1 / -1;
      font-weight: 700
    }

    .btn.primary:hover {
      filter: brightness(1.06)
    }

    .btn.ghost {
      background: transparent;
      color: var(--ink)
    }

    .btn.ghost:hover {
      border-color: var(--gold);
      color: var(--gold)
    }

    .qr-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      margin: 6px 0 22px
    }

    #qr {
      background: #fff;
      padding: 12px;
      border-radius: 14px;
      line-height: 0
    }

    #qr img,
    #qr canvas {
      display: block
    }

    .qr-cap {
      font-size: 10.5px;
      color: var(--muted);
      letter-spacing: .8px;
      text-transform: uppercase;
      font-weight: 600
    }

    .save {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px;
      border-radius: 12px;
      border: 1px dashed var(--line);
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: .15s;
    }

    .save:hover {
      color: var(--gold);
      border-color: var(--gold)
    }

    .foot {
      margin-top: 18px;
      text-align: center;
      font-size: 10.5px;
      color: var(--muted);
      letter-spacing: .3px
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="logo"><span class="f">F</span><span class="m">M</span></div>

    <div class="top">
      <div class="photo" id="photo"><span class="f">F</span><span class="m">M</span></div>
      <div>
        <h1 id="c-name">Florian Marin</h1>
        <div class="role" id="c-role">CRM RevOps Sprint</div>
      </div>
    </div>

    <p class="tagline" id="c-tagline"></p>
    <div class="divider"></div>

    <div class="actions" id="actions"></div>

    <div class="qr-wrap">
      <div id="qr"></div>
    </div>

    <button class="save" id="saveBtn">＋ Enregistrer le contact (.vcf)</button>

    <div class="foot" id="c-foot"></div>
  </div>

  <script>
    const CONFIG = {
      name: "Florian Marin",
      role: "CRM RevOps Sprint",
      taglineHTML: "Je rends à ton CRM <b>la vérité sur ton pipeline</b> en 6 semaines. Sans HubSpot, sans usine à gaz, sans louer ta stack.",
      email: "contact@florianmarin.me",
      calendly: "https://calendly.com/florian-marin/revops-sprint-discovery",
      site: "https://florianmarin.me",
      linkedin: "https://www.linkedin.com/in/florian-marin",
      phone: "+33 7 69 50 37 73",
      photo: "assets/profile.png"
    };
    /* ========================================================= */

    // --- Remplissage texte ---
    document.getElementById('c-name').textContent = CONFIG.name;
    document.getElementById('c-role').textContent = CONFIG.role;
    document.getElementById('c-tagline').innerHTML = CONFIG.taglineHTML;

    // --- Photo (ou fallback logo FM) ---
    if (CONFIG.photo) {
      const p = document.getElementById('photo');
      p.innerHTML = '';
      const img = document.createElement('img');
      img.src = CONFIG.photo; img.alt = CONFIG.name;
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;border-radius:16px';
      img.onerror = () => { p.innerHTML = '<span class="f">F</span><span class="m">M</span>'; };
      p.appendChild(img);
    }

    // --- Boutons (n'affiche que ce qui est renseigné) ---
    const A = document.getElementById('actions');
    const ic = {
      cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
      mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg>',
      li: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.55V9h3.57v11.45zM22.22 0H1.77C.8 0 0 .78 0 1.75v20.5C0 23.22.8 24 1.77 24h20.45c.98 0 1.78-.78 1.78-1.75V1.75C24 .78 23.2 0 22.22 0z"/></svg>',
      web: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg>',
      news: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9h4"/><path d="M18 14h-8M15 18h-5M10 6h8v4h-8Z"/></svg>',
      tel: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6a2 2 0 0 1 1.7 2Z"/></svg>'
    };
    function add(cls, icon, label, href) {
      A.insertAdjacentHTML('beforeend',
        `<a class="btn ${cls}" href="${href}" target="_blank" rel="noopener">${icon}<span>${label}</span></a>`);
    }

    add('primary', ic.cal, 'Réserver un créneau', CONFIG.calendly);
    add('ghost', ic.mail, 'Email', 'mailto:' + CONFIG.email);
    if (CONFIG.linkedin && !CONFIG.linkedin.includes('XXXX')) add('ghost', ic.li, 'LinkedIn', CONFIG.linkedin);
    if (CONFIG.site) add('ghost', ic.web, 'Site', CONFIG.site);
    if (CONFIG.substack && !CONFIG.substack.includes('XXXX')) add('ghost', ic.news, 'Newsletter', CONFIG.substack);
    if (CONFIG.phone && !CONFIG.phone.includes('X')) add('ghost', ic.tel, 'Appeler', 'tel:' + CONFIG.phone.replace(/\s/g, ''));

    // --- QR vers Calendly (noir sur blanc) ---
    new QRCode(document.getElementById('qr'), {
      text: 'https://florianmarin.me/vcard', width: 150, height: 150,
      colorDark: "#1C1C1C", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M
    });

    // --- Footer ---
    document.getElementById('c-foot').textContent = CONFIG.email + (CONFIG.site ? ' · ' + CONFIG.site.replace(/^https?:\/\//, '') : '');

    // --- vCard téléchargeable ---
    document.getElementById('saveBtn').addEventListener('click', () => {
      const [first, ...rest] = CONFIG.name.split(' ');
      const last = rest.join(' ');
      let v = ["BEGIN:VCARD", "VERSION:3.0",
        `N:${last};${first};;;`, `FN:${CONFIG.name}`,
        `TITLE:${CONFIG.role}`, `EMAIL;TYPE=WORK:${CONFIG.email}`];
      if (CONFIG.phone && !CONFIG.phone.includes('X')) v.push(`TEL;TYPE=CELL:${CONFIG.phone}`);
      if (CONFIG.site) v.push(`URL:${CONFIG.site}`);
      if (CONFIG.linkedin && !CONFIG.linkedin.includes('XXXX')) v.push(`URL;TYPE=LinkedIn:${CONFIG.linkedin}`);
      v.push(`NOTE:${CONFIG.taglineHTML.replace(/<[^>]+>/g, '')} — RDV: ${CONFIG.calendly}`);
      v.push("END:VCARD");
      const blob = new Blob([v.join("\n")], { type: "text/vcard" });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = "Florian-Marin.vcf"; a.click();
    });
  </script>
</body>

</html>
